name: CI

# Staged pipeline. Every quality job calls one section of scripts/verify.sh, so the checks
# are defined once and shared with Husky (VERIFY_FAST=1) and the `ship` skill.
#
#   lint ─┐                                 ┌─ test-backend ─┐
#         ├─────────────────────────────────┤                ├─ build ─ e2e
#   typecheck ┘                             └─ test-frontend ┘
#   security (gitleaks · forbidden word · npm audit)      trace (AC → tests)
#
# On a push to main (release/hotfix merge) and only with every stage green, the `deploy` job
# runs .github/workflows/deploy.yml (CD to AWS through OIDC).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on develop/main: it may be deploying.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with: { packages: backend frontend }
      - run: scripts/verify.sh lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with: { packages: backend frontend }
      - run: scripts/verify.sh typecheck

  test-backend:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with: { packages: backend }
      - run: scripts/verify.sh test-backend
      - name: Coverage summary
        if: always()
        run: scripts/ci-coverage-summary.sh backend >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage-backend, path: backend/coverage/, retention-days: 7, if-no-files-found: ignore }

  test-frontend:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with: { packages: frontend }
      - run: scripts/verify.sh test-frontend
      - name: Coverage summary
        if: always()
        run: scripts/ci-coverage-summary.sh frontend >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage-frontend, path: frontend/coverage/, retention-days: 7, if-no-files-found: ignore }

  security:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for gitleaks and the forbidden-word scan
      - uses: actions/setup-node@v5
        with: { node-version: 24 } # same npm as the other jobs for a reproducible audit
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks · forbidden word · npm audit
        env:
          FORBIDDEN_WORD: ${{ secrets.FORBIDDEN_WORD }}
        run: scripts/verify.sh security # npm audit only needs the lockfiles

  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with: { packages: root }
      - name: Traceability (AC → tests, shipped specs)
        run: npx tsx scripts/trace.ts --shipped --out trace.md
      - name: Traceability summary
        if: always()
        run: |
          { echo "## Trazabilidad"; cat trace.md 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with: { packages: backend frontend }
      - run: scripts/verify.sh build
      - name: Frontend bundle for E2E (API mocked in the browser)
        working-directory: frontend
        env: { VITE_API_URL: 'http://api.mock' }
        run: npx vite build --logLevel warn --outDir dist-e2e
      - uses: actions/upload-artifact@v4
        with: { name: frontend-e2e-dist, path: frontend/dist-e2e/, retention-days: 3 }

  e2e:
    # Spec 007: full checkout flow on the bundle from `build`, API mocked, three browsers.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with: { packages: frontend }
      - uses: actions/download-artifact@v4
        with: { name: frontend-e2e-dist, path: frontend/dist }
      - name: Install Playwright browsers (Chromium, Firefox, WebKit)
        run: npx playwright install --with-deps chromium firefox webkit
      - name: E2E (375×667, three browsers, prebuilt bundle)
        env: { E2E_PREBUILT: '1' }
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  deploy:
    needs: [e2e, security, trace]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
