name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for gitleaks and the forbidden-word scan

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend
          npm --prefix backend run prisma:generate

      - name: Quality gate (scripts/verify.sh)
        env:
          FORBIDDEN_WORD: ${{ secrets.FORBIDDEN_WORD }}
        run: scripts/verify.sh

      - name: Traceability (scripts/trace.ts)
        run: npx tsx scripts/trace.ts --shipped --out trace.md

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Coverage"
            for pkg in backend frontend; do
              f="$pkg/coverage/coverage-summary.json"
              if [ -f "$f" ]; then node -e "const t=require('./$f').total;console.log('**$pkg**: lines '+t.lines.pct+'% · branches '+t.branches.pct+'% · functions '+t.functions.pct+'% · statements '+t.statements.pct+'%')"; else echo "**$pkg**: sin datos (verify falló antes de la cobertura)"; fi
            done
            echo; echo "## Trazabilidad"; cat trace.md 2>/dev/null
          } >> "$GITHUB_STEP_SUMMARY"
