name: Deploy

# CD to production. Called by CI (.github/workflows/ci.yml, job `deploy`) after every push to
# `main` once all CI stages are green; can also be run by hand on `main` (workflow_dispatch).
# AWS access through OIDC: assumes the role from infra/github-oidc.yaml, no AWS keys in GitHub.
# The `production` environment only allows `main` and holds the backend secrets.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.web_url }}
    env:
      AWS_REGION: us-east-2
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with: { packages: backend frontend }

      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gh-deploy-${{ github.run_id }}
          aws-region: us-east-2

      - name: Deploy (scripts/deploy.sh)
        id: deploy
        env:
          CFN_EXEC_ROLE_ARN: ${{ vars.CFN_EXEC_ROLE_ARN }}
          SMOKE_TEST: '0'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          GATEWAY_BASE_URL: ${{ secrets.GATEWAY_BASE_URL }}
          GATEWAY_PUBLIC_KEY: ${{ secrets.GATEWAY_PUBLIC_KEY }}
          GATEWAY_PRIVATE_KEY: ${{ secrets.GATEWAY_PRIVATE_KEY }}
          GATEWAY_INTEGRITY_SECRET: ${{ secrets.GATEWAY_INTEGRITY_SECRET }}
          GATEWAY_EVENTS_SECRET: ${{ secrets.GATEWAY_EVENTS_SECRET }}
          BASE_FEE_IN_CENTS: ${{ secrets.BASE_FEE_IN_CENTS }}
          DELIVERY_FEE_IN_CENTS: ${{ secrets.DELIVERY_FEE_IN_CENTS }}
        run: scripts/deploy.sh

      - name: Smoke test (/health + SPA renders against this API)
        run: scripts/smoke-test.sh "${{ steps.deploy.outputs.api_url }}" "${{ steps.deploy.outputs.web_url }}"

      - name: Summary
        run: |
          {
            echo "## Despliegue"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Front: ${{ steps.deploy.outputs.web_url }}"
            echo "- API: ${{ steps.deploy.outputs.api_url }} (Swagger: /docs)"
          } >> "$GITHUB_STEP_SUMMARY"
