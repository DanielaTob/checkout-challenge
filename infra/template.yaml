AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Checkout challenge (deployed in us-east-2) - NestJS API on Lambda (outside VPC) behind an HTTP API,
  React SPA on a private S3 bucket served by CloudFront (OAC, HTTPS, security headers).

Parameters:
  ProjectName:
    Type: String
    Default: checkout-challenge
  LambdaRuntime:
    Type: String
    Default: nodejs22.x
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: Neon prod branch, pooled connection string (sslmode=require)
  GatewayBaseUrl:
    Type: String
  GatewayPublicKey:
    Type: String
  GatewayPrivateKey:
    Type: String
    NoEcho: true
  GatewayIntegritySecret:
    Type: String
    NoEcho: true
  GatewayEventsSecret:
    Type: String
    NoEcho: true
  BaseFeeInCents:
    Type: Number
  DeliveryFeeInCents:
    Type: Number
  # Spec 010: alarm thresholds. p95 includes POST /transactions, which waits for the gateway
  # up to ~25 s, so a lower threshold would fire on normal payments.
  AlarmLatencyP95Ms:
    Type: Number
    Default: 15000
  Alarm5xxThreshold:
    Type: Number
    Default: 5
    Description: 5xx responses in 5 minutes that trigger the alarm
  LogLevel:
    Type: String
    Default: info
    AllowedValues: [debug, info, warn, error]

Resources:
  # ---------------------------------------------------------------- Backend
  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess # spec 010: X-Ray traces

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-api'
      Description: NestJS checkout API (hexagonal + ROP)
      Runtime: !Ref LambdaRuntime
      Architectures: [arm64]
      Handler: dist/lambda.handler
      MemorySize: 1024
      Timeout: 29 # HTTP API integration limit is 30 s
      Role: !GetAtt ApiFunctionRole.Arn
      Code: ../.build/backend-lambda.zip # uploaded by `aws cloudformation package`
      # Spec 010: X-Ray on the Lambda (HTTP APIs v2 do not support active tracing).
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          NODE_ENV: production
          NODE_OPTIONS: --enable-source-maps
          LOG_LEVEL: !Ref LogLevel
          DATABASE_URL: !Ref DatabaseUrl
          GATEWAY_BASE_URL: !Ref GatewayBaseUrl
          GATEWAY_PUBLIC_KEY: !Ref GatewayPublicKey
          GATEWAY_PRIVATE_KEY: !Ref GatewayPrivateKey
          GATEWAY_INTEGRITY_SECRET: !Ref GatewayIntegritySecret
          GATEWAY_EVENTS_SECRET: !Ref GatewayEventsSecret
          BASE_FEE_IN_CENTS: !Ref BaseFeeInCents
          DELIVERY_FEE_IN_CENTS: !Ref DeliveryFeeInCents
          CORS_ORIGINS: !Sub 'https://${Distribution.DomainName}'

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ApiFunction}'
      RetentionInDays: 14

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-http-api'
      ProtocolType: HTTP
      # CORS is handled by NestJS (enableCors with CORS_ORIGINS), so OPTIONS reaches Lambda.

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000

  HttpApiDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Sub 'integrations/${HttpApiIntegration}'

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  # ---------------------------------------------------------- Observability
  # Spec 010: the API writes one JSON line per event to stdout; these filters turn the
  # `payment.finalized` events into business metrics.
  PaymentsApprovedMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiFunctionLogGroup
      FilterPattern: '{ $.event = "payment.finalized" && $.status = "APPROVED" }'
      MetricTransformations:
        - { MetricNamespace: CheckoutChallenge, MetricName: PaymentsApproved, MetricValue: '1', DefaultValue: 0, Unit: Count }

  PaymentsDeclinedMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiFunctionLogGroup
      FilterPattern: '{ $.event = "payment.finalized" && $.status = "DECLINED" }'
      MetricTransformations:
        - { MetricNamespace: CheckoutChallenge, MetricName: PaymentsDeclined, MetricValue: '1', DefaultValue: 0, Unit: Count }

  PaymentsErrorMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiFunctionLogGroup
      FilterPattern: '{ $.event = "payment.finalized" && $.status = "ERROR" }'
      MetricTransformations:
        - { MetricNamespace: CheckoutChallenge, MetricName: PaymentsError, MetricValue: '1', DefaultValue: 0, Unit: Count }

  # No alarm actions on purpose (spec 010): no SNS/email; alarms are shown on the dashboard.
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-api-5xx'
      AlarmDescription: HTTP API 5xx responses above the threshold in 5 minutes
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{ Name: ApiId, Value: !Ref HttpApi }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref Alarm5xxThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ApiLatencyP95Alarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-api-latency-p95'
      AlarmDescription: HTTP API p95 latency above the threshold for 2 periods of 5 minutes
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions: [{ Name: ApiId, Value: !Ref HttpApi }]
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref AlarmLatencyP95Ms
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref ProjectName
      DashboardBody: !Sub |
        {
          "start": "-PT24H",
          "widgets": [
            { "type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": { "markdown": "## ${ProjectName} · API y pagos\nHTTP API ${HttpApi} · Lambda ${ApiFunction} · logs JSON con requestId (spec 010)" } },
            { "type": "metric", "x": 0, "y": 2, "width": 8, "height": 6,
              "properties": { "title": "Peticiones", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [ [ "AWS/ApiGateway", "Count", "ApiId", "${HttpApi}", { "label": "Peticiones" } ] ] } },
            { "type": "metric", "x": 8, "y": 2, "width": 8, "height": 6,
              "properties": { "title": "Errores HTTP (4xx / 5xx)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [ [ "AWS/ApiGateway", "4xx", "ApiId", "${HttpApi}", { "label": "4xx", "color": "#ff7f0e" } ],
                             [ "AWS/ApiGateway", "5xx", "ApiId", "${HttpApi}", { "label": "5xx", "color": "#d62728" } ] ] } },
            { "type": "metric", "x": 16, "y": 2, "width": 8, "height": 6,
              "properties": { "title": "Latencia (ms)", "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                "metrics": [ [ "AWS/ApiGateway", "Latency", "ApiId", "${HttpApi}", { "stat": "p50", "label": "p50" } ],
                             [ "AWS/ApiGateway", "Latency", "ApiId", "${HttpApi}", { "stat": "p95", "label": "p95" } ] ],
                "annotations": { "horizontal": [ { "label": "Alarma p95", "value": ${AlarmLatencyP95Ms} } ] } } },
            { "type": "metric", "x": 0, "y": 8, "width": 8, "height": 6,
              "properties": { "title": "Pagos por estado", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [ [ "CheckoutChallenge", "PaymentsApproved", { "label": "APPROVED", "color": "#2ca02c" } ],
                             [ "CheckoutChallenge", "PaymentsDeclined", { "label": "DECLINED", "color": "#ff7f0e" } ],
                             [ "CheckoutChallenge", "PaymentsError", { "label": "ERROR", "color": "#d62728" } ] ] } },
            { "type": "metric", "x": 8, "y": 8, "width": 8, "height": 6,
              "properties": { "title": "Lambda: errores y throttles", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [ [ "AWS/Lambda", "Errors", "FunctionName", "${ApiFunction}", { "label": "Errors", "color": "#d62728" } ],
                             [ "AWS/Lambda", "Throttles", "FunctionName", "${ApiFunction}", { "label": "Throttles" } ] ] } },
            { "type": "metric", "x": 16, "y": 8, "width": 8, "height": 6,
              "properties": { "title": "Lambda: duración (ms)", "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                "metrics": [ [ "AWS/Lambda", "Duration", "FunctionName", "${ApiFunction}", { "stat": "p50", "label": "p50" } ],
                             [ "AWS/Lambda", "Duration", "FunctionName", "${ApiFunction}", { "stat": "p95", "label": "p95" } ] ] } },
            { "type": "alarm", "x": 0, "y": 14, "width": 8, "height": 4,
              "properties": { "title": "Alarmas", "alarms": [ "${Api5xxAlarm.Arn}", "${ApiLatencyP95Alarm.Arn}" ] } },
            { "type": "log", "x": 8, "y": 14, "width": 16, "height": 8,
              "properties": { "title": "Últimos warn/error (logs JSON)", "region": "${AWS::Region}", "view": "table",
                "query": "SOURCE '${ApiFunctionLogGroup}' | fields @timestamp, level, requestId, context, event, method, path, statusCode, durationMs, message | filter level = 'error' or level = 'warn' | sort @timestamp desc | limit 20" } }
          ]
        }

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-web-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  FrontendOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${ProjectName}-security-headers'
        # Spec 008 (HTTP Observatory): headers CloudFront has no dedicated field for.
        # COEP is left out on purpose: only needed for cross-origin isolation, which the SPA doesn't use.
        CustomHeadersConfig:
          Items:
            - { Header: Cross-Origin-Opener-Policy, Value: same-origin, Override: true }
            - { Header: Cross-Origin-Resource-Policy, Value: same-origin, Override: true }
            - { Header: Permissions-Policy, Value: 'camera=(), microphone=(), geolocation=(), usb=(), payment=()', Override: true }
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub >-
              default-src 'self';
              script-src 'self';
              style-src 'self';
              img-src 'self' data:;
              font-src 'self';
              connect-src 'self' https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com;
              frame-ancestors 'none';
              base-uri 'self';
              form-action 'self';
              object-src 'none'

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName} SPA'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: spa-bucket
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOac
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: spa-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        # SPA routing: unknown paths fall back to index.html
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOacRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  ApiUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
  FrontendUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  FrontendBucketName:
    Value: !Ref FrontendBucket
  DistributionId:
    Value: !Ref Distribution
  ApiFunctionName:
    Value: !Ref ApiFunction
  DashboardUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${Dashboard}'
